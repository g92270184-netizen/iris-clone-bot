<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рейтинг</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        body { background: #0a0a0a; color: #fff; padding: 16px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; font-weight: 600; }
        .icon { width: 22px; height: 22px; fill: #8e8e93; }
        .podium { display: flex; align-items: flex-end; justify-content: center; gap: 6px; margin-bottom: 24px; }
        .podium-item { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 100px; }
        .podium-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-bottom: 6px; border: 2px solid; }
        .podium-name { font-size: 11px; font-weight: 600; text-align: center; max-width: 90px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .podium-score { font-size: 11px; color: #ffd60a; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 3px; }
        .podium-base { width: 100%; border-radius: 8px 8px 0 0; display: flex; justify-content: center; align-items: flex-start; padding-top: 8px; font-size: 22px; font-weight: 800; color: rgba(0,0,0,0.5); }
        .podium-1 { background: linear-gradient(180deg, #ffd60a, #c9a000); height: 100px; }
        .podium-2 { background: linear-gradient(180deg, #d0d0d0, #909090); height: 80px; }
        .podium-3 { background: linear-gradient(180deg, #e8a87c, #a05a2c); height: 65px; }
        .list { background: #1c1c1e; border-radius: 14px; overflow: hidden; }
        .list-item { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #2c2c2e; }
        .list-item:last-child { border-bottom: none; }
        .list-rank { width: 24px; font-size: 13px; font-weight: 600; color: #8e8e93; text-align: center; margin-right: 10px; }
        .list-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; margin-right: 10px; background: #2c2c2e; }
        .list-name { flex: 1; font-size: 14px; font-weight: 500; }
        .list-score { font-size: 14px; font-weight: 600; color: #ffd60a; display: flex; align-items: center; gap: 4px; }
        .star-icon { width: 14px; height: 14px; fill: #ffd60a; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Рейтинг чата</h1>
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
    </div>
    <div class="podium" id="podium"></div>
    <div class="list" id="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0a0a0a');

        const data = [
            { name: 'Fridge', score: 63836, avatar: 'https://i.pravatar.cc/150?img=12' },
            { name: 'Плотный ворк', score: 16914, avatar: 'https://i.pravatar.cc/150?img=33' },
            { name: 'I am the test', score: 15321, avatar: 'https://i.pravatar.cc/150?img=68' },
            { name: '.', score: 13903, avatar: 'https://i.pravatar.cc/150?img=11' },
            { name: 'Qwert', score: 10076, avatar: 'https://i.pravatar.cc/150?img=59' },
        ];
        data.sort((a, b) => b.score - a.score);

        const starSvg = '<svg class="star-icon" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';

        const podiumEl = document.getElementById('podium');
        const top3 = [data[1], data[0], data[2]];
        const ranks = [2, 1, 3];
        top3.forEach((user, i) => {
            if (!user) return;
            const rank = ranks[i];
            const borderColor = rank === 1 ? '#ffd60a' : rank === 2 ? '#d0d0d0' : '#e8a87c';
            const div = document.createElement('div');
            div.className = 'podium-item';
            div.innerHTML = `<img src="${user.avatar}" class="podium-avatar" style="border-color: ${borderColor}"><div class="podium-name">${user.name}</div><div class="podium-score">${starSvg} ${user.score.toLocaleString()}</div><div class="podium-base podium-${rank}">${rank}</div>`;
            podiumEl.appendChild(div);
        });

        const listEl = document.getElementById('list');
        data.slice(3).forEach((user, i) => {
            const rank = i + 4;
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<div class="list-rank">${rank}</div><img src="${user.avatar}" class="list-avatar"><div class="list-name">${user.name}</div><div class="list-score">${starSvg} ${user.score.toLocaleString()}</div>`;
            listEl.appendChild(div);
        });
    </script>
</body>
</html>
