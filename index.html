<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рейтинг чата</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            padding: 16px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header .info {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #2c2c2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #8e8e93;
        }

        .podium {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            margin-bottom: 24px;
            padding: 0 10px;
        }

        .podium-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            max-width: 100px;
        }

        .podium-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 6px;
            border: 2px solid;
        }

        .podium-name {
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90px;
            margin-bottom: 2px;
        }

        .podium-score {
            font-size: 11px;
            color: #ffd60a;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .podium-base {
            width: 100%;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 8px;
            font-size: 22px;
            font-weight: 800;
            color: rgba(0,0,0,0.5);
        }

        .podium-1 { background: linear-gradient(180deg, #ffd60a, #c9a000); height: 100px; }
        .podium-2 { background: linear-gradient(180deg, #d0d0d0, #909090); height: 80px; }
        .podium-3 { background: linear-gradient(180deg, #e8a87c, #a05a2c); height: 65px; }

        .list {
            background: #1c1c1e;
            border-radius: 14px;
            overflow: hidden;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #2c2c2e;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-rank {
            width: 24px;
            font-size: 13px;
            font-weight: 600;
            color: #8e8e93;
            text-align: center;
            margin-right: 10px;
        }

        .list-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
            background: #2c2c2e;
        }

        .list-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }

        .list-score {
            font-size: 14px;
            font-weight: 600;
            color: #ffd60a;
        }

        .update-text {
            font-size: 11px;
            color: #8e8e93;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏆 Рейтинг чата</h1>
        <div class="info">i</div>
    </div>

    <div class="podium" id="podium"></div>
    <div class="list" id="list"></div>
    <div class="update-text">Рейтинг обновляется каждые 24 часа</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0a0a0a');

        // Демо-данные (потом заменим на реальные)
        const data = [
            { name: 'Fridge', score: 63836, avatar: 'https://i.pravatar.cc/150?img=12' },
            { name: 'Плотный ворк', score: 16914, avatar: 'https://i.pravatar.cc/150?img=33' },
            { name: 'I\'m the test', score: 15321, avatar: 'https://i.pravatar.cc/150?img=68' },
            { name: '.', score: 13903, avatar: 'https://i.pravatar.cc/150?img=11' },
            { name: 'Qwert', score: 10076, avatar: 'https://i.pravatar.cc/150?img=59' },
            { name: 'Masry', score: 9342, avatar: 'https://i.pravatar.cc/150?img=60' },
            { name: '†Mordefet†', score: 5413, avatar: 'https://i.pravatar.cc/150?img=15' },
            { name: 'Amir††', score: 4920, avatar: 'https://i.pravatar.cc/150?img=14' },
            { name: 'Татьянка', score: 4641, avatar: 'https://i.pravatar.cc/150?img=5' },
            { name: 'Octopus', score: 4605, avatar: 'https://i.pravatar.cc/150?img=8' },
        ];

        data.sort((a, b) => b.score - a.score);

        const podiumEl = document.getElementById('podium');
        const top3 = [data[1], data[0], data[2]];
        const ranks = [2, 1, 3];

        top3.forEach((user, i) => {
            if (!user) return;
            const rank = ranks[i];
            const borderColor = rank === 1 ? '#ffd60a' : rank === 2 ? '#d0d0d0' : '#e8a87c';
            
            const div = document.createElement('div');
            div.className = 'podium-item';
            div.innerHTML = `
                <img src="${user.avatar}" class="podium-avatar" style="border-color: ${borderColor}">
                <div class="podium-name">${user.name}</div>
                <div class="podium-score">⭐ ${user.score.toLocaleString()}</div>
                <div class="podium-base podium-${rank}">${rank}</div>
            `;
            podiumEl.appendChild(div);
        });

        const listEl = document.getElementById('list');
        data.slice(3).forEach((user, i) => {
            const rank = i + 4;
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `
                <div class="list-rank">${rank}</div>
                <img src="${user.avatar}" class="list-avatar">
                <div class="list-name">${user.name}</div>
                <div class="list-score">⭐ ${user.score.toLocaleString()}</div>
            `;
            listEl.appendChild(div);
        });
    </script>
</body>
</html>
